<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | User Portal</title>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
      <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-dark">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="auth-card bg-black text-white rounded-4 shadow-lg p-4 p-md-5 w-100">
            <div class="text-center mb-4">
               
                <h1 class="fw-bold mb-2">Create your account</h1>
               
            </div>

            <form action="">
                <div class="mb-3">
                    <label for="signup-name" class="form-label">Full name</label>
                    <input id="signup-name" class="form-control form-control-lg" type="text" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label for="signup-email" class="form-label">Email address</label>
                    <input id="signup-email" class="form-control form-control-lg" type="email" placeholder="you@example.com" required>
                </div>
                <div class="mb-4">
                    <label for="signup-password" class="form-label">Password</label>
                    <input id="signup-password" class="form-control form-control-lg" type="password" placeholder="Create a password" required>
                </div>
                <button class="btn btn-success btn-lg w-100 fw-semibold" type="submit">Sign Up</button>
            </form>

            <p class="text-center text-secondary mt-4 mb-0">Already have an account?
                <a class="link-danger fw-semibold" href="login.html">Log in</a>
            </p>
        </section>
    </main>

    <style>
        body { background: linear-gradient(135deg, #070707 0%, #151515 100%) !important; }
        .auth-card { max-width: 500px; border: 1px solid #2f2f2f; }
        .form-control { border-color: #343a40; background-color: #f8f9fa; }
        .form-control:focus { border-color: #dc3545; box-shadow: 0 0 0 .25rem rgba(220, 53, 69, .25); }
        .btn-success { --bs-btn-bg: #198754; --bs-btn-border-color: #198754; --bs-btn-hover-bg: #157347; --bs-btn-hover-border-color: #146c43; }
    </style>
</body>
</html>
